<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control de Tintorería</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel CDN para interpretar JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const PROCESOS_BASE = [
      { id: 'p1', nombre: 'Desengome', min: 10, max: 20, defecto: 15 },
      { id: 'p2', nombre: 'Stone wash', min: 30, max: 60, defecto: 45 },
      { id: 'p3', nombre: 'Teñido', min: 20, max: 90, defecto: 45 },
      { id: 'p4', nombre: 'Enjuague', min: 5, max: 20, defecto: 10 },
      { id: 'p5', nombre: 'Suavizado', min: 10, max: 30, defecto: 15 },
      { id: 'p6', nombre: 'Secado', min: 20, max: 60, defecto: 30 },
    ];

    function App() {
      // Estado de configuración de la tanda
      const [referencia, setReferencia] = useState('');
      const [totalUnidades, setTotalUnidades] = useState(900);
      const [numTandas, setNumTandas] = useState(6);
      
      // Estado de selección de procesos
      const [procesosDisponibles, setProcesosDisponibles] = useState(PROCESOS_BASE);
      const [secuencia, setSecuencia] = useState([]);
      const [nuevoProcesoNombre, setNuevoProcesoNombre] = useState('');

      // Estado de ejecución
      const [enEjecucion, setEnEjecucion] = useState(false);
      const [tandaActual, setTandaActual] = useState(1);
      const [pasoActualIdx, setPasoActualIdx] = useState(0);
      const [tiempoRestanteSeg, setTiempoRestanteSeg] = useState(0);
      const [pausado, setPausado] = useState(false);
      const [historial, setHistorial] = useState([]);
      const [pestana, setPestana] = useState('config'); // 'config', 'ejecucion', 'historial'

      // Cargar historial local al iniciar
      useEffect(() => {
        const guardado = localStorage.getItem('tintoreria_historial');
        if (guardado) {
          try { setHistorial(JSON.parse(guardado)); } catch (e) {}
        }
      }, []);

      // Temporizador en tiempo real
      useEffect(() => {
        let timer = null;
        if (enEjecucion && !pausado && tiempoRestanteSeg > 0) {
          timer = setInterval(() => {
            setTiempoRestanteSeg((prev) => prev - 1);
          }, 1000);
        } else if (enEjecucion && !pausado && tiempoRestanteSeg === 0) {
          avanzarPaso();
        }
        return () => clearInterval(timer);
      }, [enEjecucion, pausado, tiempoRestanteSeg]);

      // Agregar proceso a la secuencia actual
      const agregarASecuencia = (proceso) => {
        setSecuencia([...secuencia, { ...proceso, minutosConfigurados: proceso.defecto, instanceId: Date.now() + Math.random() }]);
      };

      // Cambiar minutos de un proceso en la secuencia
      const actualizarMinutos = (instanceId, nuevosMinutos) => {
        setSecuencia(secuencia.map(item => item.instanceId === instanceId ? { ...item, minutosConfigurados: parseInt(nuevosMinutos) } : item));
      };

      // Eliminar un proceso de la secuencia
      const eliminarDeSecuencia = (instanceId) => {
        setSecuencia(secuencia.filter(item => item.instanceId !== instanceId));
      };

      // Crear nuevo tipo de proceso
      const crearNuevoProceso = () => {
        if (!nuevoProcesoNombre.trim()) return;
        const nuevo = {
          id: 'custom_' + Date.now(),
          nombre: nuevoProcesoNombre.trim(),
          min: 5,
          max: 120,
          defecto: 20
        };
        setProcesosDisponibles([...procesosDisponibles, nuevo]);
        setNuevoProcesoNombre('');
      };

      // Iniciar ejecución
      const iniciarProcesoGlobal = () => {
        if (!referencia) {
          alert('Por favor ingresa una Referencia.');
          return;
        }
        if (secuencia.length === 0) {
          alert('Agrega al menos un proceso a la secuencia.');
          return;
        }
        setTandaActual(1);
        setPasoActualIdx(0);
        setTiempoRestanteSeg(secuencia[0].minutosConfigurados * 60);
        setEnEjecucion(true);
        setPausado(false);
        setPestana('ejecucion');
      };

      // Avanzar al siguiente paso o tanda
      const avanzarPaso = () => {
        if (pasoActualIdx + 1 < secuencia.length) {
          const sigIdx = pasoActualIdx + 1;
          setPasoActualIdx(sigIdx);
          setTiempoRestanteSeg(secuencia[sigIdx].minutosConfigurados * 60);
        } else {
          // Tanda finalizada
          const nuevaEntradaHistorial = {
            id: Date.now(),
            fecha: new Date().toLocaleString(),
            referencia,
            tanda: `${tandaActual} de ${numTandas}`,
            unidadesTanda: Math.round(totalUnidades / numTandas),
            procesosTotal: secuencia.length,
            tiempoTotalMin: secuencia.reduce((acc, curr) => acc + curr.minutosConfigurados, 0)
          };
          const nuevoHistorial = [nuevaEntradaHistorial, ...historial];
          setHistorial(nuevoHistorial);
          localStorage.setItem('tintoreria_historial', JSON.stringify(nuevoHistorial));

          if (tandaActual < numTandas) {
            alert(`¡Tanda ${tandaActual} completada! Iniciando Tanda ${tandaActual + 1}`);
            setTandaActual(tandaActual + 1);
            setPasoActualIdx(0);
            setTiempoRestanteSeg(secuencia[0].minutosConfigurados * 60);
          } else {
            alert('¡Todas las tandas de esta producción han finalizado con éxito!');
            setEnEjecucion(false);
            setPestana('historial');
          }
        }
      };

      // Exportar historial a CSV (Excel)
      const exportarExcel = () => {
        if (historial.length === 0) {
          alert('No hay historial para exportar.');
          return;
        }
        let csvContent = "data:text/csv;charset=utf-8,ID,Fecha,Referencia,Tanda,Unidades,Procesos,Tiempo Total (Min)\n";
        historial.forEach(row => {
          csvContent += `${row.id},"${row.fecha}","${row.referencia}","${row.tanda}",${row.unidadesTanda},${row.procesosTotal},${row.tiempoTotalMin}\n`;
        });
        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", `Historial_Tintoreria_${new Date().toISOString().slice(0,10)}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };

      const formatTiempo = (segundos) => {
        const m = Math.floor(segundos / 60);
        const s = segundos % 60;
        return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
      };

      return (
        <div class="max-w-4xl mx-auto p-4 md:p-6">
          {/* Encabezado */}
          <header class="bg-slate-900 text-white p-6 rounded-2xl shadow-lg mb-6 flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
              <h1 class="text-2xl font-bold tracking-wide">Control de Procesos - Tintorería</h1>
              <p class="text-slate-400 text-sm">Gestión de tiempos, referencias y seguimiento de tandas</p>
            </div>
            <div class="flex gap-2">
              <button onClick={() => setPestana('config')} class={`px-4 py-2 rounded-xl font-semibold transition ${pestana === 'config' ? 'bg-blue-600 text-white' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'}`}>
                Configuración
              </button>
              <button onClick={() => setPestana('ejecucion')} disabled={!enEjecucion} class={`px-4 py-2 rounded-xl font-semibold transition ${pestana === 'ejecucion' ? 'bg-blue-600 text-white' : 'bg-slate-800 text-slate-500 cursor-not-allowed'}`}>
                Ejecución {enEjecucion && '•'}
              </button>
              <button onClick={() => setPestana('historial')} class={`px-4 py-2 rounded-xl font-semibold transition ${pestana === 'historial' ? 'bg-blue-600 text-white' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'}`}>
                Historial
              </button>
            </div>
          </header>

          {/* VISTA CONFIGURACIÓN */}
          {pestana === 'config' && (
            <div class="space-y-6">
              {/* Información General */}
              <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                <h2 class="text-lg font-bold mb-4 text-slate-700">1. Datos de Producción</h2>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                  <div>
                    <label class="block text-sm font-medium text-slate-600 mb-1">Referencia / Lote</label>
                    <input 
                      type="text" 
                      placeholder="Ej: REF-ALGODON-900" 
                      value={referencia} 
                      onChange={(e) => setReferencia(e.target.value)}
                      class="w-full border border-slate-300 p-3 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none"
                    />
                  </div>
                  <div>
                    <label class="block text-sm font-medium text-slate-600 mb-1">Total Unidades</label>
                    <input 
                      type="number" 
                      value={totalUnidades} 
                      onChange={(e) => setTotalUnidades(Number(e.target.value))}
                      class="w-full border border-slate-300 p-3 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none"
                    />
                  </div>
                  <div>
                    <label class="block text-sm font-medium text-slate-600 mb-1">Número de Tandas</label>
                    <input 
                      type="number" 
                      value={numTandas} 
                      onChange={(e) => setNumTandas(Number(e.target.value))}
                      class="w-full border border-slate-300 p-3 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none"
                    />
                  </div>
                </div>
                <div class="mt-4 p-3 bg-blue-50 text-blue-800 rounded-xl text-sm font-medium">
                  Cálculo estimado: <span class="font-bold">{Math.round(totalUnidades / (numTandas || 1))}</span> unidades por tanda.
                </div>
              </div>

              {/* Selección y Ajuste de Procesos */}
              <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                <h2 class="text-lg font-bold mb-4 text-slate-700">2. Selección y Tiempos de Procesos</h2>
                
                {/* Botones para agregar procesos */}
                <div class="mb-6">
                  <span class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Agregar Proceso:</span>
                  <div class="flex flex-wrap gap-2">
                    {procesosDisponibles.map((proc) => (
                      <button 
                        key={proc.id} 
                        onClick={() => agregarASecuencia(proc)}
                        class="bg-slate-100 border border-slate-300 hover:bg-blue-50 hover:border-blue-400 text-slate-700 px-3 py-2 rounded-xl text-sm font-medium transition"
                      >
                        + {proc.nombre}
                      </button>
                    ))}
                  </div>
                  
                  {/* Crear proceso personalizado */}
                  <div class="mt-3 flex gap-2">
                    <input 
                      type="text" 
                      placeholder="Otro proceso..." 
                      value={nuevoProcesoNombre}
                      onChange={(e) => setNuevoProcesoNombre(e.target.value)}
                      class="border border-slate-300 px-3 py-1.5 rounded-xl text-sm focus:ring-2 focus:ring-blue-500 outline-none"
                    />
                    <button onClick={crearNuevoProceso} class="bg-slate-800 text-white px-3 py-1.5 rounded-xl text-sm font-medium hover:bg-slate-700">
                      Crear
                    </button>
                  </div>
                </div>

                {/* Lista de Secuencia Configurables */}
                {secuencia.length === 0 ? (
                  <div class="text-center py-8 text-slate-400 border-2 border-dashed border-slate-200 rounded-xl">
                    Haz clic en los botones de arriba para construir la secuencia de procesos.
                  </div>
                ) : (
                  <div class="space-y-4">
                    {secuencia.map((item, index) => (
                      <div key={item.instanceId} class="bg-slate-50 p-4 rounded-xl border border-slate-200 flex flex-col md:flex-row md:items-center justify-between gap-4">
                        <div class="flex items-center gap-3">
                          <span class="w-7 h-7 bg-blue-600 text-white rounded-full flex items-center justify-center font-bold text-xs">
                            {index + 1}
                          </span>
                          <span class="font-bold text-slate-800">{item.nombre}</span>
                        </div>

                        {/* Slider de tiempo */}
                        <div class="flex-1 max-w-md flex items-center gap-3">
                          <span class="text-xs text-slate-500">{item.min}m</span>
                          <input 
                            type="range" 
                            min={item.min} 
                            max={item.max} 
                            value={item.minutosConfigurados}
                            onChange={(e) => actualizarMinutos(item.instanceId, e.target.value)}
                            class="w-full accent-blue-600 h-2 bg-slate-200 rounded-lg cursor-pointer"
                          />
                          <span class="text-xs text-slate-500">{item.max}m</span>
                          <span class="w-16 text-right font-bold text-blue-600 bg-blue-100 px-2 py-1 rounded-lg text-sm">
                            {item.minutosConfigurados} min
                          </span>
                        </div>

                        <button onClick={() => eliminarDeSecuencia(item.instanceId)} class="text-red-500 hover:text-red-700 text-sm font-medium self-end md:self-center">
                          Quitar
                        </button>
                      </div>
                    ))}
                  </div>
                )}
              </div>

              {/* Botón de Inicio */}
              <button 
                onClick={iniciarProcesoGlobal} 
                disabled={secuencia.length === 0}
                class="w-full bg-emerald-600 hover:bg-emerald-700 disabled:bg-slate-300 text-white font-bold py-4 rounded-2xl shadow-lg transition text-lg"
              >
                Iniciar Producción en Planta
              </button>
            </div>
          )}

          {/* VISTA EJECUCIÓN */}
          {pestana === 'ejecucion' && enEjecucion && (
            <div class="space-y-6">
              <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 flex justify-between items-center">
                <div>
                  <span class="text-xs font-semibold uppercase tracking-wider text-slate-400">Referencia Actual</span>
                  <h2 class="text-xl font-bold text-slate-800">{referencia}</h2>
                </div>
                <div class="text-right">
                  <span class="text-xs font-semibold uppercase tracking-wider text-slate-400">Progreso Lote</span>
                  <div class="text-lg font-bold text-blue-600">Tanda {tandaActual} de {numTandas}</div>
                </div>
              </div>

              {/* Temporizador Central */}
              <div class="bg-slate-900 text-white p-8 rounded-3xl shadow-xl text-center space-y-4">
                <span class="inline-block bg-blue-500/20 text-blue-400 px-4 py-1 rounded-full text-sm font-semibold border border-blue-500/30">
                  Proceso #{pasoActualIdx + 1}: {secuencia[pasoActualIdx]?.nombre}
                </span>

                <div class="text-6xl md:text-7xl font-extrabold tracking-tight font-mono text-emerald-400 py-4">
                  {formatTiempo(tiempoRestanteSeg)}
                </div>

                <div class="flex justify-center gap-4 pt-2">
                  <button 
                    onClick={() => setPausado(!pausado)}
                    class={`px-6 py-3 rounded-xl font-bold text-white transition ${pausado ? 'bg-emerald-600 hover:bg-emerald-700' : 'bg-amber-500 hover:bg-amber-600'}`}
                  >
                    {pausado ? 'Reanudar' : 'Pausar'}
                  </button>
                  <button 
                    onClick={avanzarPaso}
                    class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-xl font-bold transition"
                  >
                    Siguiente Proceso $\rightarrow$
                  </button>
                </div>
              </div>

              {/* Lista de Pasos de la Tanda */}
              <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                <h3 class="font-bold text-slate-700 mb-4">Secuencia de la Tanda</h3>
                <div class="space-y-2">
                  {secuencia.map((sec, idx) => (
                    <div 
                      key={sec.instanceId} 
                      class={`p-3 rounded-xl flex justify-between items-center border ${
                        idx === pasoActualIdx 
                          ? 'bg-blue-50 border-blue-400 font-bold text-blue-900' 
                          : idx < pasoActualIdx 
                            ? 'bg-emerald-50 border-emerald-200 text-emerald-700' 
                            : 'bg-slate-50 border-slate-200 text-slate-500'
                      }`}
                    >
                      <span>{idx + 1}. {sec.nombre}</span>
                      <span>{sec.minutosConfigurados} min</span>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}

          {/* VISTA HISTORIAL */}
          {pestana === 'historial' && (
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
              <div class="flex justify-between items-center mb-6">
                <div>
                  <h2 class="text-xl font-bold text-slate-800">Historial de Tandas Finalizadas</h2>
                  <p class="text-slate-500 text-sm">Registros almacenados localmente en tu navegador</p>
                </div>
                <button 
                  onClick={exportarExcel}
                  class="bg-emerald-600 hover:bg-emerald-700 text-white font-semibold px-4 py-2 rounded-xl transition flex items-center gap-2"
                >
                  📥 Exportar a Excel (CSV)
                </button>
              </div>

              {historial.length === 0 ? (
                <p class="text-center py-8 text-slate-400">No hay registros completados aún.</p>
              ) : (
                <div class="overflow-x-auto">
                  <table class="w-full text-left border-collapse">
                    <thead>
                      <tr class="border-b border-slate-200 text-slate-400 text-xs uppercase tracking-wider">
                        <th class="p-3">Fecha</th>
                        <th class="p-3">Referencia</th>
                        <th class="p-3">Tanda</th>
                        <th class="p-3">Unidades</th>
                        <th class="p-3">Procesos</th>
                        <th class="p-3">Duración Total</th>
                      </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-100 text-sm text-slate-700">
                      {historial.map((h) => (
                        <tr key={h.id} class="hover:bg-slate-50">
                          <td class="p-3 font-medium">{h.fecha}</td>
                          <td class="p-3 font-bold text-slate-900">{h.referencia}</td>
                          <td class="p-3">{h.tanda}</td>
                          <td class="p-3">{h.unidadesTanda} u</td>
                          <td class="p-3">{h.procesosTotal} pasos</td>
                          <td class="p-3 font-semibold text-blue-600">{h.tiempoTotalMin} min</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              )}
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
